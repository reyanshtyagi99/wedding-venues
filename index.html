<!DOCTYPE html>
<html>
<head>
    <title>Wedding Venues</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .sagai, .shaadi {
            flex: 1; /* each takes half of the screen */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .sagai {
            background-image: url("The Grand Piaza.webp");
        }
        .shaadi {
            background-image: url("Krishna Greens By Mapple Gold.webp");
        }
        h1 {
            font-size: 6vw;
            margin-bottom: 10px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
        }
        a {
            font-size: 4vw;
            color: #ffeb3b;
            text-decoration: none;
            background-color: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 8px;
        }
        a:hover {
            background-color: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="sagai">
        <h1>Sagai venue</h1>
        <p><a href="https://share.google/eO8roaczZYbvyBlWo" target="_blank">Visit Sagai Venue</a></p>
    </div>

    <div class="shaadi">
        <h1>Shaadi venue</h1>
        <p><a href="https://share.google/s51gGUjbov48OxyKW" target="_blank">Visit Shaadi Venue</a></p>
    </div>
</body>
</html>
